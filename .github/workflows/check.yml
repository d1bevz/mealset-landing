name: Check landing

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Bun
        run: npm install --global bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Build the production container
        run: docker build --build-arg SITE_URL=https://mealset.example -t mealset-landing:ci .
      - name: Start and verify HTTP
        env:
          SITE_URL: https://mealset.example
          LANDING_IMAGE_TAG: ci
        run: |
          docker compose up -d --no-build --wait --wait-timeout 60
          bun run verify:http
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
        env:
          SITE_URL: https://mealset.example
          LANDING_IMAGE_TAG: ci
      - name: Stop containers
        if: always()
        run: docker compose down
        env:
          SITE_URL: https://mealset.example
          LANDING_IMAGE_TAG: ci
