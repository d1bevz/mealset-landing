name: Publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global bun@1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_TRAILING_SLASH: 'true'
        run: bun run build
      - name: Check static pages and assets
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CHECK_STATIC_HOST: 'true'
        run: |
          preview="$RUNNER_TEMP/pages-preview"
          mkdir -p "$preview$SITE_BASE_PATH"
          cp -a dist/client/. "$preview$SITE_BASE_PATH/"
          python3 -m http.server 48189 --bind 127.0.0.1 --directory "$preview" > "$RUNNER_TEMP/pages-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail "http://127.0.0.1:48189$SITE_BASE_PATH/" > /dev/null
          CHECK_URL="http://127.0.0.1:48189$SITE_BASE_PATH/" bun run verify:http
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
