name: mealset-landing
services:
  landing:
    image: mealset-landing:${LANDING_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?Set SITE_URL in .env to the public origin}
    ports:
      - '${LANDING_BIND_IP:-127.0.0.1}:${LANDING_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
